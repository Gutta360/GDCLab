<div class="app-shell">

  <header class="main-header">

    <div class="brand">
      GDCLab
    </div>

    <nav class="main-navigation" aria-label="Main navigation">

      <a
        routerLink="/home"
        routerLinkActive="active"
        class="nav-item home-link"
        aria-label="Home"
        (click)="closeMenu()"
      >
        <svg
          class="home-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 10.8L12 3l9 7.8" />
          <path d="M5.5 9.5V21h13V9.5" />
          <path d="M9.5 21v-6.5h5V21" />
        </svg>
      </a>

      <div class="nav-dropdown" [class.open]="isMenuOpen('registrations')">
        <button type="button" class="nav-item nav-toggle" [class.active]="isSectionActive(['/registrations'])" [attr.aria-expanded]="isMenuOpen('registrations')" (click)="toggleMenu('registrations')">Registration</button>
        <div class="dropdown-menu">
          <a routerLink="/registrations/new" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">New Registration</a>
          <a routerLink="/registrations/search" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">Registration Search</a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('tests')">
        <button type="button" class="nav-item nav-toggle" [class.active]="isSectionActive(['/tests'])" [attr.aria-expanded]="isMenuOpen('tests')" (click)="toggleMenu('tests')">Tests</button>
        <div class="dropdown-menu">
          <a routerLink="/tests/search" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">Tests Search</a>
          <a routerLink="/tests/master" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">Test Master</a>
        </div>
      </div>

      <div class="nav-dropdown" [class.open]="isMenuOpen('payments')">
        <button type="button" class="nav-item nav-toggle" [class.active]="isSectionActive(['/payments'])" [attr.aria-expanded]="isMenuOpen('payments')" (click)="toggleMenu('payments')">Payments</button>
        <div class="dropdown-menu">
          <a routerLink="/payments/search" routerLinkActive="active" class="dropdown-item" (click)="closeMenu()">Payments Search</a>
        </div>
      </div>

    </nav>

    <button
      type="button"
      class="logout-button"
      aria-label="Logout"
      (click)="logout()"
    >
      ⏻
    </button>

  </header>

  <main class="application-content">
    <router-outlet />
  </main>

</div>
