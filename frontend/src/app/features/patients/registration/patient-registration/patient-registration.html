<section class="registration-page">

  <div class="page-header">
    <h1>Register Patient</h1>
  </div>

  <app-patient-form
    mode="create"
    [loading]="loading"
    (formSubmit)="onPatientCreate($event)"
  >
  </app-patient-form>

</section>

@if (snackbarMessage) {
  <div
    class="notification-strip"
    [class.success]="snackbarType === 'success'"
    [class.error]="snackbarType === 'error'"
    role="alert"
  >
    <span class="notification-strip-text">
      {{ snackbarMessage }}
    </span>
  </div>
}
