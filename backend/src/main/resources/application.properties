spring.application.name=gdclab-backend
server.port=${SERVER_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gdc?currentSchema=gdclab}
spring.datasource.username=${DB_USERNAME:gdc_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=gdclab

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=gdclab
spring.flyway.default-schema=gdclab
spring.flyway.create-schemas=true
